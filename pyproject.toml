[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-annotation-check"
version = "0.1.0"
description = "Checks whether MCP server tools behave as their annotations claim"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = ["mcp>=2.3,<3", "httpx>=0.27", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[project.scripts]
mcp-annotation-check = "mcp_annotation_check.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-m 'not live'"
testpaths = ["tests"]
markers = ["live: tests that hit the live GitHub API (excluded by default)"]
